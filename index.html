    <!-- Global Auto OS Detection getApp Script -->
    <script>
      function getApp() {
        var userAgent = navigator.userAgent || navigator.vendor || window.opera || '';
        if (/android/i.test(userAgent)) {
          // Automatic redirect for Android
          window.location.href = "https://play.google.com/store/apps/details?id=com.netstudio.app";
        } else if ((/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
          // Automatic redirect for iOS
          window.location.href = "https://apps.apple.com/app/netstudio/id6470000000";
        } else {
          // Fallback for Desktop
          if (window.__triggerDesktopGetAppModal) {
            window.__triggerDesktopGetAppModal();
          } else {
            alert("Please download NetStudio from Google Play or App Store.");
          }
        }
      }
    </script>
